behaviors:
  # Must match "Behavior Name" in Unity's Behavior Parameters component
  MissileGuidance:
    trainer_type: ppo
    hyperparameters:
      # Number of experiences per gradient descent update (increase to 2048 if using 16+ arenas)
      batch_size: 1024
      # Total experiences collected before updating the policy (typically 10x batch_size)
      buffer_size: 10240
      learning_rate: 3.0e-4
      # Entropy bonus: encourages exploration early on; lower slightly if actions stay too noisy
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      # Automatically tracks running mean/variance of your 19 inputs for stable training
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        # Discount factor: 0.99 makes the missile value hitting the target over short-term steps
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 300000
    # Total steps across the ENTIRE training session before Python stops
    max_steps: 10000000
    # Number of steps collected per agent before sending trajectories to the trainer
    time_horizon: 256
    # How often training stats print to the terminal and TensorBoard
    summary_freq: 30000